<div class="cart-item-wrapper">
    <app-product-image [product]="item().product"></app-product-image>
    <div class="info-wrapper">
        <h2>{{ item().product.name }}</h2>
        <div class="price">Price: {{ item().product.price | currency:'USD' }}</div>
    </div>
</div>
<ng-content />
<div class="remove-wrapper" (click)="removeItem()">
    <span>Remove</span>
    <mat-icon class="remove-icon">delete</mat-icon>
</div>
