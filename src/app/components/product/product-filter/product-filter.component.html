<app-search [value]="keywords()" (valueChange)="updateKeywords($event)"></app-search>
<app-category [value]="category()" (valueChange)="updateCategory($event)"></app-category>
<app-price-range [rangeStart]="priceRange().minPrice" [rangeEnd]="priceRange().maxPrice" (rangeChange)="updatePrice($event)"></app-price-range>
